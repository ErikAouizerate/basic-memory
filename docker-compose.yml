services:
  basic-memory:
    image: ghcr.io/basicmachines-co/basic-memory:latest
    command:
      - basic-memory
      - mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --path
      - /mcp
      - --project
      - main
    environment:
      # BASIC_MEMORY_HOME (/app/data/basic-memory) and BASIC_MEMORY_PROJECT_ROOT
      # (/app/data) are already set by the image; do not override them.
      BASIC_MEMORY_DEFAULT_PROJECT: main
      # Without this the server writes config.json, memory.db and the embedding
      # cache to $HOME/.basic-memory, which no volume covers: the whole index
      # would be rebuilt on every redeploy. /app/.basic-memory exists in the
      # image owned by appuser, so the named volume inherits writable ownership.
      BASIC_MEMORY_CONFIG_DIR: /app/.basic-memory
      # Set to "false" if the host is short on RAM: search falls back to
      # full-text instead of downloading the ~130MB embedding model.
      BASIC_MEMORY_SEMANTIC_SEARCH_ENABLED: "true"
    volumes:
      # Markdown notes. The image points BASIC_MEMORY_HOME at /app/data/basic-memory.
      - notes:/app/data
      # config.json, memory.db and the fastembed model cache, redirected here by
      # BASIC_MEMORY_CONFIG_DIR above.
      - config:/app/.basic-memory
    # No published ports: only the gateway can reach this service.
    expose:
      - "8000"
    restart: unless-stopped

  syncthing:
    image: syncthing/syncthing:latest
    # Never "basic-memory": that would register a second A record for the
    # name and make the gateway's basic-memory:8000 dials nondeterministic.
    hostname: syncthing
    environment:
      # Match the basic-memory image's appuser (UID/GID 1000) so both
      # containers can write the shared notes volume.
      PUID: "1000"
      PGID: "1000"
      # Management UI stays on loopback; it is never published or exposed.
      STGUIADDRESS: "127.0.0.1:8384"
    # The image entrypoint only chowns $HOME (/var/syncthing), not volumes
    # mounted under it, so a fresh named volume at /var/syncthing/config is
    # root-owned and the daemon crash-loops. Chown it first, then let the
    # official entrypoint run.
    entrypoint: /bin/sh -c "chown $${PUID}:$${PGID} /var/syncthing/config && exec /bin/entrypoint.sh /bin/syncthing"
    volumes:
      # Helper scripts, run via the Dokploy service terminal or
      # `docker compose exec -T syncthing sh /scripts/...`.
      - ./scripts:/scripts:ro
      # Device identity (key.pem) + config.xml. Must persist across
      # redeploys or the device ID changes and clients have to re-pair.
      - syncthing-config:/var/syncthing/config
      # Same notes volume as basic-memory; the shared folder is
      # /var/syncthing/data/basic-memory.
      - notes:/var/syncthing/data
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?MCP_TOKEN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - basic-memory
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

  todo-agent:
    # Autonomously processes todo/ notes on the notes volume via the
    # OpenCode Zen API (see README "Todo agent").
    image: python:3.12-slim
    working_dir: /agent
    command: ["python", "/agent/main.py"]
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      # Directory holding the notes for project "main". Defaults to the
      # project root (BASIC_MEMORY_HOME /app/data/basic-memory), where fresh
      # deployments and Syncthing put the notes directly, so todo/ resolves
      # to /app/data/basic-memory/todo. Local dev nests the notes under a
      # main/ subfolder; that override lives in docker-compose.override.yml.
      NOTES_DIR: ${NOTES_DIR:-/app/data/basic-memory}
      STATE_DIR: /app/state
    volumes:
      - ./agent:/agent:ro
      - notes:/app/data
      # Agent bookkeeping (state.json). Deliberately outside the notes
      # volume: never synced by Syncthing, never conflicts.
      - todo-agent-state:/app/state
    restart: unless-stopped

volumes:
  notes:
  config:
  syncthing-config:
  todo-agent-state:

networks:
  dokploy-network:
    external: true
