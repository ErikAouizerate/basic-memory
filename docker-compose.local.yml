# Local testing only. Publishes the gateway on the loopback interface so
# scripts/smoke-test.sh can reach it without Traefik in front.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Dokploy uses docker-compose.yml alone and routes through dokploy-network.
services:
  gateway:
    ports:
      - "127.0.0.1:8080:8080"
